; PlatformIO Project Configuration File
; Two environments: nav (sensor/AHRS board) and display (OLED board)
; Build with:  pio run -e nav    OR    pio run -e display

[env]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; ---------------------------------------------------------------------------
; NAV device — sensors, AHRS, GPS, flow, dead reckoning
; ---------------------------------------------------------------------------
[env:nav]
upload_port = COM7
monitor_port = COM7
build_src_filter =
    +<nav_main.cpp>
    +<drivers/i2c_bus.cpp>
    +<drivers/lsm6ds33.cpp>
    +<drivers/lis3mdl.cpp>
    +<drivers/flow_sensor.cpp>
    +<drivers/gps.cpp>
    +<sensors/*.cpp>
    +<math/*.cpp>
    +<nav/nav_model.cpp>
    +<net/*.cpp>
    +<util/*.cpp>
build_flags = -DBUILD_NAV
lib_deps =
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit GPS Library@^1.7.4

; ---------------------------------------------------------------------------
; DISPLAY device — TFT via EyeSPI + buttons, receives nav data over serial link
; ---------------------------------------------------------------------------
[env:display]
upload_port = COM5
monitor_port = COM5
monitor_filters = send_on_enter
build_src_filter =
    +<display_main.cpp>
    +<drivers/display.cpp>
    +<menu/*.cpp>
    +<util/nvs_state.cpp>
build_flags = -DBUILD_DISPLAY
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    bblanchon/ArduinoJson@^7
